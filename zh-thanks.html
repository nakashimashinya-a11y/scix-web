<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #1B2A4A;
    --navy-deep: #0F1A2E;
    --navy-light: #2A3D62;
    --gold: #C49A3C;
    --gold-light: #D4AF5C;
    --gold-pale: rgba(196, 154, 60, 0.08);
    --green: #1A7A4C;
    --green-light: rgba(26, 122, 76, 0.08);
    --white: #FFFFFF;
    --off-white: #F8F7F4;
    --gray-100: #F3F2EF;
    --gray-300: #D1CFC9;
    --gray-500: #8A8780;
    --text-primary: #1B2A4A;
    --text-secondary: #5A6577;
  }

  body {
    font-family: 'Noto Sans SC', 'Noto Sans JP', sans-serif;
    color: var(--text-primary);
    background: var(--off-white);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  .thanks-main {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 32px;
  }

  .thanks-card {
    background: var(--white); border-radius: 16px; padding: 60px 56px;
    max-width: 640px; width: 100%; text-align: center;
    box-shadow: 0 1px 3px rgba(27, 42, 74, 0.04), 0 12px 40px rgba(27, 42, 74, 0.07);
    border: 1px solid rgba(27, 42, 74, 0.05); animation: fadeUp 0.6s ease-out;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .check-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--green-light); border: 2px solid rgba(26, 122, 76, 0.15);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px; animation: scaleIn 0.5s ease-out 0.2s both;
  }

  @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

  .check-circle svg {
    width: 32px; height: 32px; color: var(--green);
    stroke-dasharray: 40; stroke-dashoffset: 40;
    animation: drawCheck 0.5s ease-out 0.5s forwards;
  }

  @keyframes drawCheck { to { stroke-dashoffset: 0; } }

  .thanks-card h1 {
    font-family: 'Noto Serif SC', 'Noto Serif JP', serif; font-size: 26px; font-weight: 600;
    color: var(--navy); margin-bottom: 16px; letter-spacing: 1px;
  }

  .thanks-card .lead {
    font-size: 15px; color: var(--text-secondary); line-height: 1.9; margin-bottom: 36px;
  }

  .thanks-card .lead strong { color: var(--navy); font-weight: 500; }

  .divider {
    width: 48px; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    margin: 0 auto 32px; border-radius: 1px;
  }

  .next-steps {
    text-align: left; background: var(--off-white); border-radius: 10px;
    padding: 28px 28px; margin-bottom: 36px;
  }

  .next-steps h3 {
    font-size: 13px; font-weight: 500; color: var(--gold);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;
  }

  .step-item { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; }
  .step-item:not(:last-child) { border-bottom: 1px solid var(--gray-100); padding-bottom: 14px; margin-bottom: 4px; }

  .step-num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--navy);
    color: var(--white); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }

  .step-text { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
  .step-text strong { color: var(--navy); font-weight: 500; }

  .cta-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
    font-family: 'Noto Sans SC', 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: 0.5px; color: var(--white); background: var(--navy);
    border: none; border-radius: 8px; text-decoration: none;
    transition: all 0.3s ease; cursor: pointer;
  }

  .btn-primary:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(27, 42, 74, 0.2); }

  .btn-secondary {
    display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
    font-family: 'Noto Sans SC', 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: 0.5px; color: var(--navy); background: transparent;
    border: 1.5px solid var(--gray-300); border-radius: 8px;
    text-decoration: none; transition: all 0.3s ease; cursor: pointer;
  }

  .btn-secondary:hover { border-color: var(--gold); background: var(--gold-pale); }

  .btn-primary svg, .btn-secondary svg { width: 16px; height: 16px; }

  @media (max-width: 600px) {
    .thanks-card { padding: 44px 28px; }
    .thanks-card h1 { font-size: 22px; }
    .cta-group { flex-direction: column; }
    .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
  }
</style>
